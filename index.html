<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rotation</title>
<meta name="description" content="Track what you own, what you wear, and when to rest it.">
<meta name="theme-color" content="#f4f2ee">
<script>/* apply the saved theme before first paint */ try { const t = localStorage.getItem('rotation-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; if (localStorage.getItem('rotation-glass') !== '0') document.documentElement.dataset.glass = ''; } catch { }</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotation">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Rotation</h1>
  <button id="sync" class="sync" type="button" title="Backup status"></button>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="log" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5 4.2 5.8 2.5 10l3.6 1.2V20.5h11.8V11.2l3.6-1.2-1.7-4.2L15 3.5c-.5 1.5-1.6 2.5-3 2.5s-2.5-1-3-2.5Z"/></svg>Log</button>
  <button data-tab="closet" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.2a2 2 0 1 1 2 2v1.3"/><path d="M12 8.5 3.7 15.1c-.9.8-.4 2.4.9 2.4h14.8c1.3 0 1.8-1.6.9-2.4L12 8.5Z"/></svg>Closet</button>
  <button data-tab="calendar" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.4"/></svg>Calendar</button>
  <button data-tab="settings" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Setup</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
