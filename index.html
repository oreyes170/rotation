<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rotation</title>
<meta name="description" content="Track what you own, what you wear, and when to rest it.">
<meta name="theme-color" content="#1f2a44">
<script>/* apply the saved theme before first paint */ try { const t = localStorage.getItem('rotation-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch { }</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotation">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Rotation</h1>
  <button id="sync" class="sync" type="button" title="Backup status"></button>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="log" type="button"><span class="ti">＋</span>Log</button>
  <button data-tab="closet" type="button"><span class="ti">▦</span>Closet</button>
  <button data-tab="calendar" type="button"><span class="ti">▤</span>Calendar</button>
  <button data-tab="settings" type="button"><span class="ti">⚙</span>Setup</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
